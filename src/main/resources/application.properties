
spring.application.name=smart-hostel-complaint-system

# MySQL Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hostel_complaint_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ActiveMQ Artemis
spring.artemis.mode=native
spring.artemis.broker-url=${ARTEMIS_BROKER_URL:tcp://localhost:61616}
spring.artemis.user=${ARTEMIS_USERNAME:artemis}
spring.artemis.password=${ARTEMIS_PASSWORD}

# Logging
logging.level.org.springframework.jms=INFO
logging.level.org.springframework.boot.autoconfigure.jms=INFO
logging.level.org.apache.activemq=INFO
logging.level.com.hostelcomplaint=INFO

# Error responses
server.error.include-message=never

# Session timeout
server.servlet.session.timeout=15m
